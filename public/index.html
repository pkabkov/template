<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="index.css" />
    <title>Search | Last.fm</title>
  </head>
  <body>
    <nav>
      <div class="head-nav-container">
        <div class="head-nav-logo">last.fm</div>
        <div class="head-nav-bar">
          <a><i class="fa-solid fa-magnifying-glass"></i></a>
          <div class="nav-list">
            <ul>
              <li><a>Live</a></li>
              <li><a>Music</a></li>
              <li><a>Charts</a></li>
              <li><a>Events</a></li>
            </ul>
          </div>
          <div class="nav-divider"></div>
          <div class="nav-auth">
            <ul>
              <li id="log-in"><a>Log in</a></li>
              <li id="sign-up"><a>SIGN UP</a></li>
            </ul>
          </div>
        </div>
      </div>
    </nav>
    <div class="content-inner-wrap">
        <div class="container content-top-lower">
            <h1 class="content-top-header">Search results for "never gonna give you up"</div>
            <nav class="secondary-nav-list">
            <ul class="secondary-nav-list-items">
                <li class="secondary-nav-list-item">Top Results</li>
                <li class="secondary-nav-list-item">Artists</li>
                <li class="secondary-nav-list-item">Albums</li>
                <li class="secondary-nav-list-item">Tracks</li>
            </ul>
            </nav>
        </div>
    </div>
  </body>
</html>
